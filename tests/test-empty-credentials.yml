name: Test empty username and password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any pre-existing netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        with:
          machine: anon.example.com
      - name: Assert empty credentials written as ''
        run: |
          f="$HOME/.netrc"
          echo "content:"; cat "$f"
          expected="machine anon.example.com login '' password ''"
          if [ "$(cat "$f")" != "$expected" ]; then
            echo "FAIL: expected \"$expected\""; exit 1
          fi
          echo "PASS"
