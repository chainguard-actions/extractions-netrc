name: Test empty username and password defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure clean netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        with:
          machine: anon.example.com
      - name: Assert placeholder credentials
        run: |
          CONTENT="$(cat "$HOME/.netrc")"
          echo "content: $CONTENT"
          if [ "$CONTENT" != "machine anon.example.com login '' password ''" ]; then
            echo "FAIL: unexpected netrc content"
            exit 1
          fi
          echo "PASS"
