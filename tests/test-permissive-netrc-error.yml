name: Test failure on overly permissive existing netrc
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create world-readable netrc
        run: |
          rm -f "$HOME/.netrc"
          echo "machine pre.example.com login pre password pre" > "$HOME/.netrc"
          chmod 644 "$HOME/.netrc"
      - id: action
        uses: .
        continue-on-error: true
        with:
          machine: example.com
          username: alice
          password: s3cret
      - name: Assert action failed and file untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for permissive ~/.netrc"; exit 1
          fi
          echo "content:"; cat "$HOME/.netrc"
          if grep -q "example.com login alice" "$HOME/.netrc" && ! grep -q "^machine pre" "$HOME/.netrc"; then
            echo "FAIL: unexpected content"; exit 1
          fi
          if grep -q "login alice" "$HOME/.netrc"; then
            echo "FAIL: entry should not have been appended"; exit 1
          fi
          echo "PASS"
