name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any pre-existing netrc
        run: rm -f "$HOME/.netrc"
      - id: action
        uses: .
        with:
          machine: example.com
          username: alice
          password: s3cret
      - name: Assert netrc content and permissions
        run: |
          f="$HOME/.netrc"
          if [ ! -f "$f" ]; then echo "FAIL: $f not found"; exit 1; fi
          echo "content:"; cat "$f"
          expected="machine example.com login alice password s3cret"
          if [ "$(cat "$f")" != "$expected" ]; then
            echo "FAIL: expected '$expected'"; exit 1
          fi
          mode="$(stat -c '%a' "$f")"
          echo "mode: $mode"
          if [ "$mode" != "600" ]; then echo "FAIL: expected mode 600"; exit 1; fi
          echo "PASS"
